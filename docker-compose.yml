services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaoke-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=karaoke_db;Username=postgres;Password=postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
