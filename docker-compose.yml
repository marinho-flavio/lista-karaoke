services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaoke-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Altere 'IP_OU_NOME_DO_CONTAINER_DB' para o IP da sua máquina ou nome do container do banco existente
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=karaoke_db;Username=postgres;Password=postgres_password_change_me
    extra_hosts:
      - "host.docker.internal:host-gateway"
