<mat-toolbar color="primary">
  <i class="fa-solid fa-microphone-lines" style="margin-right: 10px;"></i>
  <span>Lista Karaokê</span>
</mat-toolbar>

<div class="container">
  <div class="search-box">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Buscar música, cantor ou código</mat-label>
      <input matInput [(ngModel)]="filtro" (keyup.enter)="buscar(true)" placeholder="Ex: Legião Urbana">
      <button mat-icon-button matSuffix (click)="buscar(true)" [disabled]="carregando">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </mat-form-field>

    <div class="alphabet-container">
      <button mat-button 
              *ngFor="let letra of alfabeto" 
              (click)="buscarPorLetra(letra)"
              [class.active]="filtro === letra"
              class="letter-button">
        {{letra}}
      </button>
      <button mat-button (click)="filtro = ''; buscar(true)" class="letter-button">
        Limpar
      </button>
    </div>
  </div>

  <div class="loading-shade" *ngIf="carregando">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="table-container mat-elevation-z2">
    <table mat-table [dataSource]="musicas">
      
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef style="width: 80px;"> Cód. </th>
        <td mat-cell *matCellDef="let musica" class="cod-cell"> {{musica.codigo}} </td>
      </ng-container>

      <ng-container matColumnDef="cantor">
        <th mat-header-cell *matHeaderCellDef> Artista </th>
        <td mat-cell *matCellDef="let musica"> {{musica.cantor}} </td>
      </ng-container>

      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef> Música </th>
        <td mat-cell *matCellDef="let musica">
          <div class="titulo">{{musica.titulo}}</div>
          <div class="letra-inicio" *ngIf="musica.inicioLetra">{{musica.inicioLetra}}</div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="musicas.length === 0 && !carregando" class="no-results">
      Nenhuma música encontrada.
    </div>
  </div>

  <div class="paginator-container">
    <mat-paginator [length]="total"
                   [pageSize]="tamanhoPagina"
                   [pageSizeOptions]="opcoesTamanhoPagina"
                   [pageIndex]="paginaAtual - 1"
                   (page)="aoMudarPagina($event)"
                   aria-label="Selecionar página">
    </mat-paginator>
  </div>
</div>
